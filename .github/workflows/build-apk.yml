name: Build INFINITY AI APK

on:
workflow_dispatch:
push:
branches: ["main"]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Gradle
    run: |
      curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
      unzip -q /tmp/gradle.zip -d /tmp
      echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

  - name: Extract Android project
    run: unzip -q INFINITY_AI_Android_Starter.zip -d .

  - name: Build APK
    run: gradle --no-daemon -p infinity_ai_android assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: INFINITY-AI-APK
      path: infinity_ai_android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
